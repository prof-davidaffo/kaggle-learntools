<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">Intelligenza artificiale, machine learning e deep learning</title>
<desc id="desc">Tre cerchi concentrici rappresentano il deep learning all'interno del machine learning, a sua volta all'interno dell'intelligenza artificiale.</desc>
<rect width="720" height="480" rx="24" fill="#f4f7fb"/>
<circle cx="360" cy="240" r="210" fill="#d8eaff" stroke="#2764a9" stroke-width="3"/>
<circle cx="360" cy="265" r="150" fill="#c5f0e0" stroke="#208465" stroke-width="3"/>
<circle cx="360" cy="294" r="83" fill="#fce5b8" stroke="#bd7919" stroke-width="3"/>
<g font-family="system-ui, sans-serif" text-anchor="middle" font-weight="700" fill="#17324b">
<text x="360" y="78" font-size="25">Intelligenza artificiale</text>
<text x="360" y="155" font-size="24">Machine learning</text>
<text x="360" y="290" font-size="23"><tspan x="360">Deep</tspan><tspan x="360" dy="29">learning</tspan></text>
</g>
</svg>
